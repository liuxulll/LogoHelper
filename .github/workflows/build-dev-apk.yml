name: Build Dev APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-dev:
    name: Build dev APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build dev APK
        run: ./gradlew assembleDev --stacktrace

      - name: Upload dev APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: logo-helper-dev-apk
          path: app/build/outputs/apk/dev/*.apk
          if-no-files-found: error
          retention-days: 30
